<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Manufacturing Manual Assistant{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f6f8; }
    .navbar-brand { font-weight: 600; }
    .citation-card { border-left: 4px solid #0d6efd; }
    .status-badge-insufficient { background: #6c757d; }
    pre.excerpt { white-space: pre-wrap; font-size: 0.9rem; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'dashboard' %}">Manual Assistant</a>
    {% if user.is_authenticated %}
      <span class="text-light me-3">{{ user.username }} &middot; {{ user.profile.get_role_display|default:"No role" }}</span>
      <form action="{% url 'logout' %}" method="post" class="d-inline">
        {% csrf_token %}
        <button class="btn btn-outline-light btn-sm" type="submit">Log out</button>
      </form>
    {% endif %}
  </div>
</nav>
<div class="container pb-5">
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function getCsrfToken() {
    const match = document.cookie.match(/csrftoken=([^;]+)/);
    return match ? match[1] : '';
  }
  async function apiFetch(url, options = {}) {
    options.headers = Object.assign({'X-CSRFToken': getCsrfToken()}, options.headers || {});
    options.credentials = 'same-origin';
    const resp = await fetch(url, options);
    return resp;
  }

  // Shared across every dashboard that shows a Question, so the
  // AI-vs-fallback label and citation rendering never drift out of sync
  // between the Engineer and Supervisor views.
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  function renderStatusBadge(status) {
    return status === 'answered'
      ? '<span class="badge bg-success">Answered</span>'
      : '<span class="badge status-badge-insufficient text-white">Insufficient evidence</span>';
  }

  // llm_provider is 'none' for insufficient-evidence questions (no model was
  // called at all), 'local' for the deterministic extractive fallback, or a
  // real provider name ('openai'/'anthropic') once one is configured.
  function renderProviderNote(llmProvider) {
    if (llmProvider === 'local') {
      return '<div class="alert alert-warning py-1 px-2 small mb-2">Not AI-generated: this answer is the matching manual text shown directly (no LLM is configured yet). See citations below for the source.</div>';
    }
    if (llmProvider && llmProvider !== 'none') {
      return `<div class="small text-muted mb-2">AI-generated answer (${escapeHtml(llmProvider)}), grounded in the citations below.</div>`;
    }
    return '';
  }

  function renderCitations(citations) {
    return (citations || []).map(c => `
      <div class="card citation-card mb-2">
        <div class="card-body py-2">
          <div class="d-flex justify-content-between">
            <strong>${escapeHtml(c.document_id)} (rev ${escapeHtml(c.revision)}) &mdash; page ${c.page_number}</strong>
            <span class="text-muted small">score ${c.score.toFixed(2)}</span>
          </div>
          <pre class="excerpt mb-1">${escapeHtml(c.excerpt)}</pre>
          ${c.manual_file_url ? `<a href="${c.manual_file_url}#page=${c.page_number}" target="_blank" class="small">Open PDF at page ${c.page_number}</a>` : ''}
        </div>
      </div>`).join('');
  }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
