<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Manufacturing Manual Assistant{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f6f8; }
    .navbar-brand { font-weight: 600; }
    .citation-card { border-left: 4px solid #0d6efd; }
    .status-badge-insufficient { background: #6c757d; }
    pre.excerpt { white-space: pre-wrap; font-size: 0.9rem; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'dashboard' %}">Manual Assistant</a>
    {% if user.is_authenticated %}
      <span class="text-light me-3">{{ user.username }} &middot; {{ user.profile.get_role_display|default:"No role" }}</span>
      <form action="{% url 'logout' %}" method="post" class="d-inline">
        {% csrf_token %}
        <button class="btn btn-outline-light btn-sm" type="submit">Log out</button>
      </form>
    {% endif %}
  </div>
</nav>
<div class="container pb-5">
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function getCsrfToken() {
    const match = document.cookie.match(/csrftoken=([^;]+)/);
    return match ? match[1] : '';
  }
  async function apiFetch(url, options = {}) {
    options.headers = Object.assign({'X-CSRFToken': getCsrfToken()}, options.headers || {});
    options.credentials = 'same-origin';
    const resp = await fetch(url, options);
    return resp;
  }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
