{% extends "manuals/base.html" %}
{% block title %}Supervisor Dashboard{% endblock %}
{% block content %}
<h2 class="mb-4">Question History (read-only)</h2>

<div class="d-flex gap-2 mb-3 align-items-center">
  <select class="form-select w-auto" id="machine-filter">
    <option value="">All machines</option>
  </select>
  <div class="form-check">
    <input class="form-check-input" type="checkbox" id="unanswered-only">
    <label class="form-check-label" for="unanswered-only">Unanswered / insufficient-evidence only</label>
  </div>
</div>

<div id="history-area"><p class="text-muted">Loading...</p></div>
{% endblock %}

{% block scripts %}
<script>
let allQuestions = [];

async function loadMachines() {
  const resp = await apiFetch('/api/machines/');
  const machines = await resp.json();
  const select = document.getElementById('machine-filter');
  select.innerHTML = '<option value="">All machines</option>' +
    machines.map(m => `<option value="${m.id}">${m.machine_id} - ${m.name}</option>`).join('');
}

function render() {
  const machineId = document.getElementById('machine-filter').value;
  const unansweredOnly = document.getElementById('unanswered-only').checked;
  let rows = allQuestions;
  if (machineId) rows = rows.filter(q => String(q.machine) === machineId);
  if (unansweredOnly) rows = rows.filter(q => q.status !== 'answered');

  const area = document.getElementById('history-area');
  if (!rows.length) {
    area.innerHTML = '<p class="text-muted">No matching questions.</p>';
    return;
  }
  // Card list (not a dense table) so the answer, provider label, and
  // citations can be shown inline - the same information an Engineer sees
  // for their own history, since a Supervisor needs to audit it, not just
  // see a status badge.
  area.innerHTML = rows.map(q => `
    <div class="card shadow-sm mb-3">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-start">
          <div>
            <h6 class="mb-0">${escapeHtml(q.question_text)}</h6>
            <div class="text-muted small">${escapeHtml(q.asked_by)} &middot; ${escapeHtml(q.machine_id_code)} &middot; ${new Date(q.created_at).toLocaleString()}</div>
          </div>
          ${renderStatusBadge(q.status)}
        </div>
        ${renderProviderNote(q.llm_provider)}
        <p class="mb-2">${escapeHtml(q.answer_text)}</p>
        ${renderCitations(q.citations)}
      </div>
    </div>`).join('');
}

async function loadHistory() {
  const resp = await apiFetch('/api/questions/');
  allQuestions = await resp.json();
  render();
}

document.getElementById('machine-filter').addEventListener('change', render);
document.getElementById('unanswered-only').addEventListener('change', render);

loadMachines();
loadHistory();
</script>
{% endblock %}
